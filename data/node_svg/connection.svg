<svg width="420" height="190" viewBox="0 0 420 190" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .line { fill: none; stroke: #ffb74d; stroke-width: 2.5; stroke-dasharray: 4,4; }
      .label { font-family: sans-serif; font-size: 12px; fill: #e0e0e0; }
      .port { fill: #4caf50; }
      .desc-box { fill: #111111; }
      .desc-text { font-family: sans-serif; font-size: 11px; fill: #aab; }
    </style>
  </defs>

  <circle cx="30" cy="50" r="8" class="port" />
  <circle cx="380" cy="50" r="8" class="port" />
  <path d="M 38 50 Q 200 10, 372 50" class="line" />
  <rect x="160" y="60" width="100" height="20" fill="#2a3a4a" rx="3" />
  <text x="210" y="74" class="label" text-anchor="middle">JSON / 文本</text>

  <line x1="20" y1="110" x2="400" y2="110" stroke="#444" stroke-width="1" />
  <rect x="25" y="120" width="370" height="55" rx="4" class="desc-box" />
  <text x="40" y="138" class="desc-text" font-weight="bold">📖 解释：</text>
  <text x="40" y="156" class="desc-text">数据管道：贝塞尔曲线连接端口，悬停高亮、选中变红。</text>
  <text x="40" y="172" class="desc-text">隐式传递数据类型（文本/JSON/二进制/控制信号），决定下游处理方式。</text>
</svg>
