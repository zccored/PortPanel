<svg width="400" height="290" viewBox="0 0 400 290" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .box { fill: #1a3a22; stroke: #cccccc; stroke-width: 2; stroke-dasharray: 6,4; rx: 8; }
      .input-port { fill: #4caf50; }
      .label { font-family: sans-serif; font-size: 12px; fill: #e0e0e0; }
      .title { font-size: 14px; font-weight: bold; fill: #fff; }
      .mono { font-family: monospace; fill: #ce9178; }
      .desc-box { fill: #0e1f14; }
      .desc-text { font-family: sans-serif; font-size: 11px; fill: #aab; }
      .arrow { fill: none; stroke: #888; stroke-width: 1.5; marker-end: url(#arrowhead); }
      .portkey { font-family: sans-serif; font-size: 10.5px; fill: #dcdcdc; }
      .portval { font-family: monospace; font-size: 10px; fill: #9fb0c0; }
      .portnote { font-family: sans-serif; font-size: 10px; fill: #8899aa; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#888" />
    </marker>
  </defs>

  <rect x="10" y="10" width="380" height="270" class="box" />
  <text x="200" y="38" class="label title" text-anchor="middle">📦 容器节点</text>
  <text x="30" y="65" class="label">存储路径：</text>
  <text x="110" y="65" class="mono">{{path}}</text>
  <text x="30" y="90" class="label">已存文件：</text>
  <text x="130" y="90" class="mono">{{files}} 个 ({{size}})</text>
  <rect x="30" y="105" width="200" height="22" fill="#14331a" stroke="#4a8a4a" rx="3" />
  <text x="40" y="120" class="mono">{{rule}}</text>

  <!-- 端口清单：NodeView._apply_hover_ports 在框被拉开那一刻按真实端口生成（顶部 y=140，页脚原始 y=200） -->
  <!-- HOVER:PORTS top=140 tail=200 -->

  <g transform="translate(0,{{tail_dy}})">
    <line x1="20" y1="200" x2="380" y2="200" stroke="#444" stroke-width="1" />
    <rect x="25" y="210" width="350" height="55" rx="4" class="desc-box" />
    <text x="40" y="228" class="desc-text" font-weight="bold">📖 解释：</text>
    <text x="40" y="246" class="desc-text">数据终点站：SHA-256 内容寻址命名 + manifest 清单去重，同名同内容不重下。</text>
    <text x="40" y="262" class="desc-text">规则模式按 JSON 字段/处理值动态创建子文件夹归档，支持数组逐项分发。</text>
  </g>
</svg>
