<svg width="420" height="290" viewBox="0 0 420 290" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .box { fill: #1a2a3e; stroke: #cccccc; stroke-width: 2; stroke-dasharray: 6,4; rx: 8; }
      .input-port { fill: #ffb74d; }
      .output-port { fill: #81c784; }
      .label { font-family: sans-serif; font-size: 12px; fill: #e0e0e0; }
      .title { font-size: 14px; font-weight: bold; fill: #90caf9; }
      .mono { font-family: monospace; fill: #b5cea8; }
      .desc-box { fill: #0c1a2a; }
      .desc-text { font-family: sans-serif; font-size: 11px; fill: #aab; }
      .arrow { fill: none; stroke: #888; stroke-width: 1.5; marker-end: url(#arrowhead); }
      .portkey { font-family: sans-serif; font-size: 10.5px; fill: #dcdcdc; }
      .portval { font-family: monospace; font-size: 10px; fill: #9fb0c0; }
      .portnote { font-family: sans-serif; font-size: 10px; fill: #8899aa; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#888" />
    </marker>
  </defs>

  <rect x="10" y="10" width="400" height="270" class="box" />
  <text x="210" y="38" class="label title" text-anchor="middle">📦 类节点</text>
  <text x="30" y="65" class="label">类名：</text>
  <text x="80" y="65" class="mono">{{class_name}}</text>
  <text x="30" y="90" class="label">轮询次数：</text>
  <text x="130" y="90" class="mono">{{poll_count}}</text>
  <text x="30" y="115" class="label">成员：</text>
  <text x="80" y="115" class="mono">{{member_count}} 个元素</text>

  <!-- 端口清单：NodeView._apply_hover_ports 在框被拉开那一刻按真实端口生成（顶部 y=135，页脚原始 y=200） -->
  <!-- HOVER:PORTS top=135 tail=200 -->

  <g transform="translate(0,{{tail_dy}})">
    <line x1="20" y1="200" x2="400" y2="200" stroke="#444" stroke-width="1" />
    <rect x="25" y="210" width="370" height="55" rx="4" class="desc-box" />
    <text x="40" y="228" class="desc-text" font-weight="bold">📖 解释：</text>
    <text x="40" y="246" class="desc-text">模块化容器：打包节点为独立模块，拥有自己的轮询次数；首个类=main 必执行。</text>
    <text x="40" y="262" class="desc-text">类间通过输入/输出触发信号连线，形成 main→触发链 的串行执行编排。</text>
  </g>
</svg>
