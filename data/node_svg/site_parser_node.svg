<svg width="420" height="290" viewBox="0 0 420 290" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .box { fill: #1a334c; stroke: #cccccc; stroke-width: 2; stroke-dasharray: 6,4; rx: 8; }
      .input-port { fill: #4caf50; }
      .output-port { fill: #f44336; }
      .label { font-family: sans-serif; font-size: 12px; fill: #e0e0e0; }
      .title { font-size: 14px; font-weight: bold; fill: #55aaff; }
      .mono { font-family: monospace; fill: #ce9178; }
      .desc-box { fill: #0d1a2a; }
      .desc-text { font-family: sans-serif; font-size: 11px; fill: #aab; }
      .arrow { fill: none; stroke: #888; stroke-width: 1.5; marker-end: url(#arrowhead); }
      .portkey { font-family: sans-serif; font-size: 10.5px; fill: #dcdcdc; }
      .portval { font-family: monospace; font-size: 10px; fill: #9fb0c0; }
      .portnote { font-family: sans-serif; font-size: 10px; fill: #8899aa; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#888" />
    </marker>
  </defs>

  <rect x="10" y="10" width="400" height="270" class="box" />
  <text x="210" y="38" class="label title" text-anchor="middle">🌐 站点解析节点</text>
  <text x="30" y="65" class="label">已识别：</text>
  <text x="100" y="65" class="mono">{{parser}}</text>
  <rect x="30" y="80" width="280" height="22" fill="#141e2a" stroke="#555" rx="3" />
  <text x="40" y="95" class="mono">{{url}}</text>

  <!-- 端口清单：NodeView._apply_hover_ports 在框被拉开那一刻按真实端口生成（顶部 y=120，页脚原始 y=200） -->
  <!-- HOVER:PORTS top=120 tail=200 -->

  <g transform="translate(0,{{tail_dy}})">
    <line x1="20" y1="200" x2="400" y2="200" stroke="#444" stroke-width="1" />
    <rect x="25" y="210" width="370" height="55" rx="4" class="desc-box" />
    <text x="40" y="228" class="desc-text" font-weight="bold">📖 解释：</text>
    <text x="40" y="246" class="desc-text">专用网盘/站点下载器（如 MEGA，自动探测本地代理）。</text>
    <text x="40" y="262" class="desc-text">下载文件流向下游容器，遵循内容哈希去重与规则子文件夹逻辑。</text>
  </g>
</svg>
