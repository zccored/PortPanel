<svg width="320" height="270" viewBox="0 0 320 270" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .box { fill: #1a2433; stroke: #cccccc; stroke-width: 2; stroke-dasharray: 6,4; rx: 8; }
      .label { font-family: sans-serif; font-size: 12px; fill: #e0e0e0; }
      .title { font-size: 14px; font-weight: bold; fill: #8ab8ff; }
      .desc-box { fill: #0e1420; }
      .desc-text { font-family: sans-serif; font-size: 11px; fill: #aab; }
      .portkey { font-family: sans-serif; font-size: 10.5px; fill: #dcdcdc; }
      .portval { font-family: monospace; font-size: 10px; fill: #9fb0c0; }
      .portnote { font-family: sans-serif; font-size: 10px; fill: #8899aa; }
    </style>
  </defs>

  <rect x="10" y="10" width="300" height="250" class="box" />
  <text x="160" y="38" class="label title" text-anchor="middle">🖼️ 图片节点</text>
  <rect x="50" y="55" width="220" height="100" fill="#2a3a4a" stroke="#555" rx="4" />
  <text x="160" y="110" class="label" text-anchor="middle">（图纸缩略图）</text>
  <text x="160" y="170" class="label" text-anchor="middle">{{filename}}</text>

  <!-- 端口清单：NodeView._apply_hover_ports 在框被拉开那一刻按真实端口生成（顶部 y=180，页脚原始 y=195） -->
  <!-- HOVER:PORTS top=180 tail=195 -->

  <g transform="translate(0,{{tail_dy}})">
    <line x1="20" y1="195" x2="300" y2="195" stroke="#444" stroke-width="1" />
    <rect x="25" y="205" width="270" height="45" rx="4" class="desc-box" />
    <text x="40" y="223" class="desc-text" font-weight="bold">📖 解释：</text>
    <text x="40" y="241" class="desc-text">静态视觉元素：拖入图片作流程参考，保存时自动内嵌 Base64 随 .wbt 迁移。</text>
  </g>
</svg>
